name: publish

# Tag-triggered release chain (decision #4419). A `v*` tag set on smoo/main after the gate-green release PR merged runs: tag checks, pricing refresh, tests, pack, npm publish (OIDC trusted publishing, provenance), dist-tags, GitHub Release with the tarball. Re-running the same tag is safe: npm publish is skipped when the version already exists, and the release asset is replaced with --clobber.
# The gate (appsec + security-review) is a separate pull_request workflow on the release PR; it is not part of this file.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match package.json $VERSION"; exit 1
          fi

      - name: Tag must be on smoo/main
        run: |
          git fetch origin smoo/main --depth=200
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/smoo/main; then
            echo "$GITHUB_SHA is not reachable from origin/smoo/main - refusing to release from a side branch"; exit 1
          fi

      - run: npm ci
      # Fail closed: an unreachable or malformed list fails the build, so no release ships a stale or empty price table. Runs before npm test so the tarball is tested with exactly the snapshot it carries.
      - name: Refresh the pricing snapshot
        run: npm run pricing:refresh
      - run: npm test

      - name: Pack the release tarball
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npm pack --ignore-scripts
          mv smoochy-claude-router-*.tgz "claude-router-${VERSION}.tgz"

      - name: Publish to npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already on the registry - skipping publish"
          else
            npm publish "./claude-router-${VERSION}.tgz" --access public --provenance
          fi

      # Mutable pointers; the immutable pin is the exact version. Needs the trusted publisher to be allowed to publish, and is idempotent.
      - name: Dist-tags latest and smoo
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          npm dist-tag add "${NAME}@${VERSION}" latest
          npm dist-tag add "${NAME}@${VERSION}" smoo

      - name: GitHub Release from the CHANGELOG section, with the tarball attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { on=1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./claude-router-*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md ./claude-router-*.tgz
          fi
