name: publish

# Builds a release tarball when a `v*` tag is pushed on smoo/main — never
# publishes to npm. This fork does not own @sheruq/claude-router on the
# registry, so no `npm publish`, no OIDC trusted-publishing exchange, no
# provenance attestation: those steps targeted a package that isn't ours and
# are gone. What stays from the inherited workflow is the guard against the
# 0.3.2/0.3.3 failure mode (a tag not matching package.json, or not reachable
# from the fork's release branch) plus `npm test` and `npm pack`. What is new
# is attaching the packed tarball to the GitHub release as a downloadable
# asset, so `npm install -g <release-asset-url>` is how this fork is installed.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match package.json $VERSION"; exit 1
          fi

      - name: Tag must be on smoo/main
        run: |
          git fetch origin smoo/main --depth=200
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/smoo/main; then
            echo "$GITHUB_SHA is not reachable from origin/smoo/main — refusing to release from a side branch"; exit 1
          fi

      - name: Pack the release tarball
        run: npm pack

      - name: GitHub release from the CHANGELOG section, with the tarball attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { on=1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md ./*.tgz
